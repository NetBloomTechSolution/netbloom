name: Keep Website Active & Ping

on:
  schedule:
    # Runs every 6 hours automatically to ensure zero dormancy
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Request
        run: |
          TARGET_URL="${{ secrets.SITE_URL || 'https://netbloom.vercel.app' }}"
          echo "Pinging health endpoint at: $TARGET_URL/api/health"
          curl -s -o /dev/null -w "Status: %{http_code}\n" "$TARGET_URL/api/health" || curl -s -o /dev/null -w "Status: %{http_code}\n" "$TARGET_URL"
